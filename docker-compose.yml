services:
  backend:
    build: ./backend
    container_name: effective-mobile-backend
    expose:
      - "8080"
    networks:
      - app-net
    restart: unless-stopped
    user: 1000:1000
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/health
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    image: unknown:<version>
    read_only: true

  nginx:
    image: nginx:1.27-alpine
    container_name: effective-mobile-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped
    user: 1000:1000
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/health
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    read_only: true

networks:
  app-net:
    driver: bridge
