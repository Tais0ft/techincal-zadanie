services:
  backend:
    build: ./backend
    container_name: effective-mobile-backend
    expose:
      - "8080"
    networks:
      - app-net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: effective-mobile-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge
